[package]
name = "ikigai-sparql"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SPARQL module for ikigai — urn:sparql:{select,ask,describe,construct} run over one or more graph=<uri> sources resolved through the kernel (federation by listing graphs), cacheable via their golden threads; urn:sparql:update applies a capability-gated, transactional SPARQL 1.1 UPDATE to a host's shared live store. Oxigraph in-memory; runs natively and in the browser (WASM)."
keywords = ["ikigai", "roc", "sparql", "rdf", "oxigraph"]
categories = ["web-programming", "database"]

[dependencies]
ikigai-core = { workspace = true }
ikigai-vocab = { workspace = true }
# The depth scans for `graph=` sources (ledger #1043): one copy of each, beside the doors that
# already use them, rather than a third copy beside ikigai-shacl's. It costs the graph nothing
# but ikigai-rdf itself: every crate it pulls in (oxrdfio, oxrdf, quick-xml at oxrdfxml's line)
# is already here through oxigraph, natively and on wasm32 (`cargo tree`, 2026-10-10).
ikigai-rdf = { workspace = true }
oxigraph = { workspace = true }
# The parser oxigraph itself uses, named directly so a query's ALGEBRA can be measured
# against the time budget's bounds before oxigraph plans it (ledger #964): planning cannot be
# cancelled. Its type must be the one oxigraph converts from (`for_query`/`for_update`), and
# oxigraph 0.5.11 pins `=0.4.7`, so this floor is that version and resolution unifies them.
# `sep-0006` because oxigraph enables it and the algebra walk names `Lateral`.
spargebra = { version = "0.4.7", features = ["sep-0006"] }
async-trait = "0.1"

[dev-dependencies]
# block_on for driving kernel.issue in the shared-store tests.
futures = "0.3"
# RDF 1.2 ON in the tests, as it is in ikigai-cli, where rudof turns on `oxigraph/rdf-12`. Needed
# for the WORKSPACE to build at all now that ikigai-rdf's tests turn on `oxrdfio/rdf-12` (ledger
# #992): that reaches oxrdf, and spargebra 0.4.7 does not compile against an rdf-12 oxrdf unless
# its own `sparql-12` is on too, which only oxigraph's `rdf-12` brings. Features unify across a
# workspace test build, so without this line `cargo test --workspace` fails in spargebra.
oxigraph = { workspace = true, features = ["rdf-12"] }
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.6.0 for SPACE-NAME (ledger #987):
# the suite holds `space()` to the name it claims.
ikigai-conformance = "0.6.0"

# Oxigraph's `js` feature wires getrandom's wasm backend (paired with the
# getrandom_backend cfg in .cargo/config.toml), so the store/query run in the browser.
[target.'cfg(target_family = "wasm")'.dependencies]
oxigraph = { workspace = true, features = ["js"] }

[package]
name = "reason-feature-consumer"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ikigai-reason = { path = "../.." }
# A sibling enables RDF 1.2 without enabling ikigai-reason/rdf-12.
ikigai-rdf = { path = "../../../ikigai-rdf", features = ["rdf-12"] }

[dev-dependencies]
ikigai-core = "0.3.0"
futures = "0.3"

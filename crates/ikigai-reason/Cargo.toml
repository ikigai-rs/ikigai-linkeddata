[package]
name = "ikigai-reason"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded OWL 2 RL closure and inferred triples as cacheable ikigai resources"

[dependencies]
ikigai-core.workspace = true
ikigai-rdf = { workspace = true, features = ["rdf-12"] }
oxrdf.workspace = true
oxrdfio = { workspace = true, features = ["rdf-12"] }
reasonable = { version = "0.4.4", features = ["rdf-12"] }
async-trait = "0.1"

[features]
# Compatibility alias: RDF 1.2 adapter support is always enabled so sibling
# dependencies cannot make reasonable's oxrdf matches non-exhaustive. The
# reasoner still accepts RDF 1.1 only and rejects triple terms before inference.
rdf-12 = []

[dev-dependencies]
futures = "0.3"
# examples/choosing.rs measures a SPARQL property path beside the reasoner (ledger #2640).
# Match the RDF 1.2 adapter support enabled by the reasoner.
ikigai-sparql = { path = "../ikigai-sparql", features = ["rdf-12"] }
ikigai-conformance = "0.14.0"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

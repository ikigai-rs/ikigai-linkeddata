[package]
name = "ikigai-sniff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Content-type sniffing for ikigai — urn:sniff classifies opaque (application/octet-stream) bytes into a concrete media type via pluggable heuristic detectors, the first step of octet-stream sniff-and-dispatch. Pure byte heuristics (no parsing); runs natively and in the browser (WASM)."
keywords = ["ikigai", "roc", "content-type", "sniff", "rdf"]
categories = ["web-programming", "parsing"]

[dependencies]
ikigai-core = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.8.0 for REQUIRED (ledger #329): a
# required input dropped from the call must be refused with a typed MissingArgument.
# A `^0.x` pin is a ceiling too: move it when the suite moves.
ikigai-conformance = "0.8.0"

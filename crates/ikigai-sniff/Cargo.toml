[package]
name = "ikigai-sniff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Content-type sniffing for ikigai — urn:sniff classifies opaque (application/octet-stream) bytes into a concrete media type via pluggable heuristic detectors, the first step of octet-stream sniff-and-dispatch. Pure byte heuristics (no parsing); runs natively and in the browser (WASM)."
keywords = ["ikigai", "roc", "content-type", "sniff", "rdf"]
categories = ["web-programming", "parsing"]

[dependencies]
ikigai-core = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound
# endpoint and reports every violation at once. 0.8.0 added REQUIRED (ledger #329);
# 0.9.0 adds core 0.1.105's contract-shape checks (REQUIRED probes input groups, OUTPUTS
# honors output_from, PIPELINE's named-only line, VALIDATE refuses a default on a binding)
# and RECOMPUTE; 0.10.0 adds FAILURES, off unless a suite opts in. The caret reads as a
# range, <0.11.0, and is still a ceiling: move it when the suite moves.
ikigai-conformance = "0.10.0"

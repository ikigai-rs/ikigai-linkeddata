[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-linkeddata"
homepage = "https://github.com/ikigai-rs/ikigai-linkeddata"

[workspace.dependencies]
# Core 0.3.0 scopes held content to its deliverer; principal-less holds and
# ContentStore::put/put_replay are root-only (ledger #2965).
# Move vocab with core so public APIs share the same core 0.3 types.
ikigai-core = "0.3.0"
ikigai-vocab = "0.3.0"
# Oxigraph's pure-Rust RDF crates — no rocksdb, so they compile to wasm32 (the
# browser transrepts/queries client-side). The full store is in-memory only.
oxrdf = "0.3"
oxrdfio = "0.2"
oxigraph = { version = "0.5", default-features = false }
# ikigai-sparql scans each `graph=` source with ikigai-rdf's depth scans before loading it
# (ledger #1043). 0.2.1 is the first with `check_json_nesting` (ledger #1038). Path AND version:
# published, the version is what a consumer resolves, so ikigai-rdf 0.2.1 goes to crates.io
# before ikigai-sparql 0.2.1 does. The workspace moves both together, so move this with it.
ikigai-rdf = { path = "crates/ikigai-rdf", version = "0.5.0" }

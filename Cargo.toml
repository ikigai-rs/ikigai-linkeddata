[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.13"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-linkeddata"
homepage = "https://github.com/ikigai-rs/ikigai-linkeddata"

[workspace.dependencies]
# 0.1.50 is the TRUE minimum, not a comfort pin: ikigai-sparql's update endpoint is
# gated purely by its DECLARED `requires`, and `Kernel::issue`'s `enforce_requires`
# (declared = enforced, before invoke and before the cache lookup) is what turns that
# declaration into a gate. Against an older core the endpoint would parse, describe
# and publish its capability — and admit every caller. Verified present in 0.1.50.
ikigai-core = "0.1.50" # enforce_requires (declared = enforced); ArgSpec one_of/default
# The ikigai vocabulary (ns# ontology + Description→Turtle). ikigai-sparql bundles its
# schema graph so endpoint instances can be joined against the class/property defs.
ikigai-vocab = "0.1.22"
# Oxigraph's pure-Rust RDF crates — no rocksdb, so they compile to wasm32 (the
# browser transrepts/queries client-side). The full store is in-memory only.
oxrdf = "0.3"
oxrdfio = "0.2"
oxigraph = { version = "0.5", default-features = false }
